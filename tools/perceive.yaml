identity:
  author: enconvert
  name: perceive
  label:
    en_US: Perceive URL
description:
  human:
    en_US: Render a web page into agent-ready outputs (markdown, HTML, screenshot, PDF, links, images, structured data) with a render_quality honesty score.
  llm: Render a single web page with EnConvert and return the requested outputs plus a render_quality score from 0 to 1 (0 means the page was blocked or empty, 1 means a clean render). Use this to read a page's content before reasoning over it.
parameters:
  - name: url
    type: string
    required: true
    form: llm
    label:
      en_US: URL
    human_description:
      en_US: The web page URL to render.
    llm_description: The absolute URL of the web page to render. Required.
  - name: outputs
    type: string
    required: false
    form: form
    label:
      en_US: Outputs
    human_description:
      en_US: 'Comma-separated outputs to return. Allowed: markdown, html_cleaned, html_raw, screenshot, screenshot_full_page, pdf, links, images, structured. Defaults to markdown,structured.'
    llm_description: Comma-separated list of outputs. Allowed values are markdown, html_cleaned, html_raw, screenshot, screenshot_full_page, pdf, links, images, structured. Leave empty to default to markdown and structured.
    placeholder:
      en_US: markdown,structured
  - name: only_main_content
    type: boolean
    required: false
    form: form
    label:
      en_US: Only Main Content
    human_description:
      en_US: Strip navigation, headers and footers, keeping only the main article content.
    llm_description: When true, return only the main article content and drop navigation, headers and footers.
extra:
  python:
    source: tools/perceive.py
